name: Kiem tra Streamlit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kiem tra import
        run: |
          python - <<'PY'
          import streamlit, pandas, numpy, plotly
          import PIL
          import research_engine
          print("Python OK")
          print("streamlit", streamlit.__version__)
          print("pandas", pandas.__version__)
          print("numpy", numpy.__version__)
          print("plotly", plotly.__version__)
          print("Pillow", PIL.__version__)
          PY

      - name: Kiem tra cu phap
        run: |
          python -m py_compile app_dashboard.py research_engine.py run_backtest.py

      - name: Chay dashboard thu
        run: |
          streamlit run app_dashboard.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          PID=$!
          sleep 12
          cat streamlit.log
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8501/
          kill $PID
